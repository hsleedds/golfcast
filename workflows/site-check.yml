# Roundcast 업로드 자동 점검: index.html을 올리면 앱 안의 자동 검사를 돌려 보고, 실패하면 GitHub가 메일로 알려 줍니다.
name: 사이트 점검
on:
  push:
    paths: ["index.html", "tools/site-check.mjs", ".github/workflows/site-check.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 브라우저 준비
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: 자동 검사 실행
        run: node tools/site-check.mjs index.html
